name: Runner versions
description: Report macOS, Xcode, and dev tool versions on the self-hosted Mac and how stale they are
inputs:
  warn:
    description: "When to emit warnings: outdated (default), stale, or none"
    required: false
    default: outdated
  skip:
    description: Space-separated tool names to skip, e.g. "node gh"
    required: false
    default: ""
  issue:
    description: "Open or update an issue in the calling repo when warnings fire, and close it when clean: true or false. Needs issues: write"
    required: false
    default: "false"
  issue-title:
    description: Issue title to match and create
    required: false
    default: ""
  token:
    description: Token used for the issue
    required: false
    default: ${{ github.token }}
outputs:
  stale:
    description: Number of tools stale or outdated (>30 days or a minor version behind)
    value: ${{ steps.versions.outputs.stale }}
  outdated:
    description: Number of tools outdated (>180 days or a major version behind)
    value: ${{ steps.versions.outputs.outdated }}
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      env:
        RUNNER_VERSIONS_WARN: ${{ inputs.warn }}
        RUNNER_VERSIONS_SKIP: ${{ inputs.skip }}
        RUNNER_VERSIONS_REPORT: ${{ runner.temp }}/runner-versions.md
      run: bash "${{ github.action_path }}/versions.sh"
    - if: inputs.issue == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        WARNED: ${{ steps.versions.outputs.warned }}
        REPORT: ${{ runner.temp }}/runner-versions.md
        ISSUE_TITLE: ${{ inputs.issue-title }}
      run: bash "${{ github.action_path }}/issue.sh"

name: Runner versions
description: Report macOS, Xcode, and dev tool versions on the self-hosted Mac and how stale they are
inputs:
  warn:
    description: "When to emit warnings: major (default), any, or none"
    required: false
    default: major
  skip:
    description: Space-separated tool names to skip, e.g. "node gh"
    required: false
    default: ""
outputs:
  behind:
    description: Number of tools behind their newest release
    value: ${{ steps.versions.outputs.behind }}
  major-behind:
    description: Number of tools a major version behind
    value: ${{ steps.versions.outputs.major-behind }}
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      env:
        RUNNER_VERSIONS_WARN: ${{ inputs.warn }}
        RUNNER_VERSIONS_SKIP: ${{ inputs.skip }}
      run: bash "${{ github.action_path }}/versions.sh"
